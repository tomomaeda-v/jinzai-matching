<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本のしごと 無料紹介 | Japan Job Support</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1e3a5f;--teal:#0e7c7b;--bg:#f4f6f9;--line:#e2e8f0;--ink:#1e293b;--muted:#64748b;--ok:#16a34a;--ng:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
.hero{background:linear-gradient(135deg,var(--navy),#0e7c7b);color:#fff;padding:28px 18px 24px;text-align:center}
.hero h1{font-size:24px;margin-bottom:8px}
.hero p{font-size:14px;opacity:.95}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.langs button{border:1px solid #cbd5e1;background:#fff;border-radius:16px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600}
.langs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
main{max-width:640px;margin:0 auto;padding:18px}
.points{display:grid;gap:10px;margin:14px 0 20px}
.pt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.pt span{font-size:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:24px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.card h2{color:var(--navy);font-size:19px;margin-bottom:4px}
.req-note{font-size:12px;color:var(--muted);margin-bottom:14px}
label{display:block;font-size:14px;font-weight:700;color:var(--navy);margin:14px 0 5px}
label .rq{color:var(--ng)}
input[type=text],input[type=tel],input[type=date],input[type=number],select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font-size:16px;font-family:inherit;background:#fff}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid #cbd5e1;border-radius:18px;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--ink);margin:0;font-size:14px}
.checks label:has(input:checked){background:#ccfbf1;border-color:var(--teal);color:#0f766e;font-weight:700}
.checks input{accent-color:var(--teal);width:18px;height:18px}
.consent{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:12px;margin-top:20px;font-weight:500;font-size:13px;color:var(--ink);cursor:pointer}
.consent:has(input:checked){border-color:var(--teal);background:#f0fdfa}
.consent input{width:22px;height:22px;accent-color:var(--teal);flex-shrink:0;margin-top:2px}
.btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.6}
.privacy{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
#msg{margin-top:14px;font-size:14px;font-weight:700;min-height:20px;text-align:center}
#done{display:none;text-align:center;padding:40px 16px}
#done .big{font-size:54px}
#done h2{color:var(--navy);margin:10px 0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:20px}
</style>
</head>
<body>

<div class="langs" id="langBar"></div>

<div class="hero">
  <h1 id="t_title"></h1>
  <p id="t_sub"></p>
</div>

<main>
  <div class="points">
    <div class="pt"><span>🆓</span><div id="t_p1"></div></div>
    <div class="pt"><span>💬</span><div id="t_p2"></div></div>
    <div class="pt"><span>🪪</span><div id="t_p3"></div></div>
  </div>

  <div class="card" id="formCard">
    <h2 id="t_form"></h2>
    <div class="req-note" id="t_req"></div>

    <label><span id="t_name"></span> <span class="rq">*</span></label>
    <input type="text" id="f_name" autocomplete="name">

    <label><span id="t_nat"></span> <span class="rq">*</span></label>
    <select id="f_nat"></select>

    <label><span id="t_field"></span> <span class="rq">*</span></label>
    <div class="checks" id="f_fields"></div>

    <label><span id="t_visa"></span> <span class="rq">*</span></label>
    <select id="f_visa"></select>

    <label><span id="t_visaExp"></span></label>
    <input type="date" id="f_visaExp">

    <label><span id="t_jp"></span></label>
    <select id="f_jp"><option value="">--</option><option>N1</option><option>N2</option><option>N3</option><option>N4</option><option>N5</option></select>

    <label><span id="t_quals"></span></label>
    <div class="checks" id="f_quals"></div>

    <label><span id="t_exp"></span></label>
    <input type="number" id="f_exp" min="0" inputmode="numeric">

    <label><span id="t_loc"></span> <span class="rq">*</span></label>
    <input type="text" id="f_loc">

    <label><span id="t_night"></span></label>
    <select id="f_night"></select>

    <label><span id="t_phone"></span> <span class="rq">*</span></label>
    <input type="tel" id="f_phone" autocomplete="tel">

    <label><span id="t_line"></span></label>
    <input type="text" id="f_line">

    <label><span id="t_wa"></span></label>
    <input type="tel" id="f_wa">

    <label><span id="t_src"></span></label>
    <select id="f_src"></select>

    <label class="consent"><input type="checkbox" id="f_consent"><span><span id="t_consent"></span> <span class="rq">*</span></span></label>

    <button class="btn" id="btnSend" onclick="submitForm()"></button>
    <div id="msg"></div>
    <div class="privacy" id="t_priv"></div>
  </div>

  <div id="done" class="card">
    <div class="big">✅</div>
    <h2 id="t_doneTitle"></h2>
    <p id="t_doneBody"></p>
  </div>
</main>

<footer>Japan Job Support</footer>

const NIGHT_VALS=["応相談","可","不可"];
const SRC_VALS=["Facebook","TikTok","Instagram","YouTube","友人・家族","その他"];
let LANG="ja";

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function setLang(l){
  LANG=l;const d=I18N[l];
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  const ids=["title","sub","p1","p2","p3","form","req","name","nat","field","visa","visaExp","jp","quals","exp","loc","night","phone","line","wa","src","consent","priv"];
  ids.forEach(k=>{const el=document.getElementById("t_"+k);if(el)el.textContent=d[k];});
  document.getElementById("btnSend").textContent=d.send;
  document.getElementById("t_doneTitle").textContent=d.doneTitle;
  document.getElementById("t_doneBody").textContent=d.doneBody;
  // 国
  const natSel=document.getElementById("f_nat");const curNat=natSel.value;
  natSel.innerHTML='<option value="">--</option>'+NATS.map((v,i)=>`<option value="${v}">${esc(d.natOpt[i])}</option>`).join("");
  if(curNat)natSel.value=curNat;
  // 分野（チェック状態を保持して表示だけ差し替え）
  const checked=[...document.querySelectorAll("#f_fields input:checked")].map(i=>i.value);
  document.getElementById("f_fields").innerHTML=FIELDS.map((v,i)=>`<label><input type="checkbox" value="${v}" ${checked.includes(v)?"checked":""}>${esc(d.fld[i])}</label>`).join("");
  // 夜勤
  const ns=document.getElementById("f_night");const curN=ns.value;
  ns.innerHTML=NIGHT_VALS.map((v,i)=>`<option value="${v}">${esc(d.night3[i])}</option>`).join("");
  if(curN)ns.value=curN;
  // 流入元
  const ss=document.getElementById("f_src");const curS=ss.value;
  ss.innerHTML=SRC_VALS.map((v,i)=>`<option value="${v}">${esc(d.src6[i])}</option>`).join("");
  if(curS)ss.value=curS;
}

function init(){
  document.getElementById("langBar").innerHTML=Object.keys(I18N).map(l=>`<button data-l="${l}" onclick="setLang('${l}')">${I18N[l].flag}</button>`).join("");
  document.getElementById("f_visa").innerHTML='<option value="">--</option>'+VISAS.map(v=>`<option value="${v[0]}">${v[0]}（${v[1]}）</option>`).join("");
  document.getElementById("f_quals").innerHTML=QUALS.map(q=>`<label><input type="checkbox" value="${q[0]}">${q[0]}（${q[1]}）</label>`).join("");
  // ブラウザ言語で初期化
  const bl=(navigator.language||"ja").slice(0,2);
  setLang(I18N[bl]?bl:"ja");
}

async function submitForm(){
  const d=I18N[LANG];
  const msg=document.getElementById("msg");
  const v=id=>document.getElementById(id).value.trim();
  const name=v("f_name"),nat=v("f_nat"),visa=v("f_visa"),loc=v("f_loc"),phone=v("f_phone");
  const fields=[...document.querySelectorAll("#f_fields input:checked")].map(i=>i.value);
  msg.style.color="var(--ng)";
  if(!name||!nat||!visa||!loc||!phone||!fields.length){msg.textContent=d.need;return;}
  if(!document.getElementById("f_consent").checked){msg.textContent=d.consentNeed;return;}
  const btn=document.getElementById("btnSend");btn.disabled=true;msg.textContent="...";
  const line=v("f_line"),wa=v("f_wa"),src=document.getElementById("f_src").value;
  const c={
    id:uid(),name:name,kana:"",nationality:nat,birth:"",gender:"",
    visa:visa,visaExpiry:v("f_visaExp"),jpLevel:v("f_jp"),
    quals:[...document.querySelectorAll("#f_quals input:checked")].map(i=>i.value),
    fields:fields,
    expYears:v("f_exp"),desiredLoc:loc,desiredSalary:null,night:document.getElementById("f_night").value,
    phone:phone,email:"",status:"未マッチ",sourceJob:"",
    memo:`【セルフ登録】希望分野: ${fields.join("・")} / 流入元: ${src} / LINE: ${line||"-"} / WhatsApp: ${wa||"-"} / 言語: ${LANG} / 同意取得済`,
    lineId:line,whatsapp:wa,source:src,registeredVia:"entry",lang:LANG,
    consent:true,consentAt:new Date().toISOString(),
    createdAt:new Date().toISOString()
  };
  const {error}=await sb.from("gm_cands").insert({id:c.id,data:c});
  if(error){btn.disabled=false;msg.textContent=d.err;return;}
  document.getElementById("formCard").style.display="none";
  document.getElementById("done").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

init();
</script>
